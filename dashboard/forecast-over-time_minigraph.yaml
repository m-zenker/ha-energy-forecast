# EDIT: replace sensor.your_daily_energy_import_kwh with your daily grid import sensor
type: custom:mini-graph-card
name: Energy Forecast vs. Real
hour24: true
points_per_hour: 4
icon: mdi:power-plug
entities:
  - entity: sensor.ha_energy_forecast_energy_forecast_today
    name: Today
    show_state: true
    fill: true
  - entity: sensor.ha_energy_forecast_energy_forecast_tomorrow
    name: Tomorrow
  - entity: sensor.your_daily_energy_import_kwh  # ← EDIT
    name: Actual Today
    show_graph: false
    show_state: true
