<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 120" width="580" height="120">
  <!-- Background -->
  <rect width="580" height="120" fill="#0F1923"/>

  <!-- Icon chip — 86x86, vertically centred -->
  <rect x="12" y="17" width="86" height="86" rx="19" fill="#18242F"/>

  <!-- Dotted lines inside chip -->
  <line x1="33" y1="38" x2="57" y2="67"
        stroke="#4A6070" stroke-width="2.2" stroke-dasharray="4 4" stroke-linecap="round"/>
  <line x1="33" y1="82" x2="57" y2="67"
        stroke="#4A6070" stroke-width="2.2" stroke-dasharray="4 4" stroke-linecap="round"/>

  <!-- Gray input dots -->
  <circle cx="33" cy="38" r="5.5" fill="#4A6070" opacity="0.85"/>
  <circle cx="33" cy="82" r="5.5" fill="#4A6070" opacity="0.85"/>

  <!-- Cyan lines -->
  <line x1="57" y1="67" x2="74" y2="67"
        stroke="#05C3DD" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="74" y1="67" x2="83" y2="55"
        stroke="#05C3DD" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Amber line -->
  <line x1="83" y1="55" x2="92" y2="40"
        stroke="#F5A623" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Cyan dots -->
  <circle cx="57" cy="67" r="7.5" fill="#05C3DD"/>
  <circle cx="74" cy="67" r="7.5" fill="#05C3DD"/>
  <circle cx="83" cy="55" r="7.5" fill="#05C3DD"/>

  <!-- Amber ring -->
  <circle cx="92" cy="40" r="9" fill="#18242F" stroke="#F5A623" stroke-width="3.5"/>

  <!-- Text -->
  <!-- "ha-" gray, "ENERGY" cyan on line 1 -->
  <text x="118" y="63"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="34" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#7A8E9E">ha-</tspan><tspan fill="#05C3DD">ENERGY</tspan>
  </text>

  <!-- "forecast" amber on line 2 -->
  <text x="118" y="96"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="30" font-weight="600" letter-spacing="0.5"
    fill="#F5A623">forecast</text>
</svg>
