<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Dark background chip -->
  <rect width="512" height="512" rx="115" fill="#0F1923"/>

  <!-- Dotted lines: gray inputs converging on first cyan node -->
  <line x1="148" y1="175" x2="218" y2="284"
        stroke="#4A6070" stroke-width="5" stroke-dasharray="9 9" stroke-linecap="round"/>
  <line x1="148" y1="348" x2="218" y2="284"
        stroke="#4A6070" stroke-width="5" stroke-dasharray="9 9" stroke-linecap="round"/>

  <!-- Gray input dots -->
  <circle cx="148" cy="175" r="13" fill="#4A6070" opacity="0.85"/>
  <circle cx="148" cy="348" r="13" fill="#4A6070" opacity="0.85"/>

  <!-- Solid cyan connecting lines -->
  <line x1="218" y1="284" x2="306" y2="284"
        stroke="#05C3DD" stroke-width="6" stroke-linecap="round"/>
  <line x1="306" y1="284" x2="352" y2="224"
        stroke="#05C3DD" stroke-width="6" stroke-linecap="round"/>

  <!-- Amber forecast line -->
  <line x1="352" y1="224" x2="398" y2="152"
        stroke="#F5A623" stroke-width="6" stroke-linecap="round"/>

  <!-- Cyan actual data dots -->
  <circle cx="218" cy="284" r="18" fill="#05C3DD"/>
  <circle cx="306" cy="284" r="18" fill="#05C3DD"/>
  <circle cx="352" cy="224" r="18" fill="#05C3DD"/>

  <!-- Amber forecast ring (hollow) -->
  <circle cx="398" cy="152" r="22" fill="#0F1923" stroke="#F5A623" stroke-width="8"/>
</svg>
