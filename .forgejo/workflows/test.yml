name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt ruff scikit-learn lightgbm pandas numpy requests holidays
      - name: Lint
        run: ruff check apps/ tests/
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
